# nginx.conf
# Sirve el frontend compilado (dist/) y actua de reverse proxy hacia el backend.

server {
    listen 8080;
    server_name _;

    # Carpeta donde la etapa de build de Vite deja el sitio compilado.
    # index.html real, no el de la raiz del repo, sino el generado por "npm run build".
    root /usr/share/nginx/html;
    index index.html;

    # Todo lo que NO sea /api/ se sirve como archivo estatico normal.
    # "try_files" intenta encontrar el archivo pedido; si no existe, cae a
    # index.html (util para apps de una sola pagina con rutas del lado del cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Todo lo que llegue a /api/ se reenvia al backend.
    #
    # OJO con esto: "proxy_pass http://api:3000;" SIN una ruta despues del
    # puerto conserva el prefijo /api/ tal cual llego. Es decir:
    #   navegador pide  -> /api/mensajes
    #   nginx reenvia a -> http://api:3000/api/mensajes
    # Esto es necesario porque el backend Go registra sus rutas CON el
    # prefijo "/api" incluido (ej. "GET /api/health" en main.go).
    # Si aqui pusieramos "http://api:3000/" (con slash final), nginx
    # RECORTARIA el /api/ antes de reenviar, y el backend nunca
    # reconoceria la ruta.
    location /api/ {
        proxy_pass http://api:3000;

        # Cabeceras estandar para que el backend sepa de donde vino
        # realmente la peticion (no de nginx, sino del cliente original).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}