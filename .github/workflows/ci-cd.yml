name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

  

jobs:
  # 2. Build: lint de todo + armado del sitio que se publica
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # --- Linters (uno por tipo de archivo) ---
      - name: Lint de React/TypeScript (ESLint)
        run: npm run lint

      - name: Lint del HTML (HTMLHint)
        run: npx htmlhint index.html

      - name: Lint de los Dockerfiles (Hadolint)
        run: |
          status=0
          for f in api/Dockerfile web/Dockerfile db/Dockerfile; do
            echo "::group::$f"
            docker run --rm -i hadolint/hadolint:v2.12.0 < "$f" || status=1
            echo "::endgroup::"
          done
          exit $status

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Lint de la API (gofmt + go vet)
        working-directory: api
        run: |
          sin_formato=$(gofmt -l .)
          if [ -n "$sin_formato" ]; then
            echo "Archivos sin formato:"; echo "$sin_formato"; exit 1
          fi
          go vet ./...

      # --- Armado del sitio ---
      - name: Armar el sitio (_site/)
        run: bash scripts/armar-sitio.sh

      - name: Subir el sitio como artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
   # 3. Test: Vitest sobre el sitio que se publica
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Mismo script que en build: se prueba exactamente lo que se publica
      - name: Armar el sitio (_site/)
        run: bash scripts/armar-sitio.sh

      - name: Pruebas del sitio (Vitest)
        run: npm test

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Pruebas de la API (go test)
        working-directory: api
        run: go test ./...
  
  # 4. Package: imágenes a GitHub Packages (ghcr.io)
  package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # necesario para subir a ghcr.io con GITHUB_TOKEN
    strategy:
      matrix:
        include:
          - imagen: perfil-web
            contexto: .
            dockerfile: web/Dockerfile
          - imagen: perfil-api
            contexto: ./api
            dockerfile: api/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # "sha-" + los 7 primeros caracteres del commit real.
      # En un PR usa el commit de la rama, no el merge temporal de GitHub.
      - name: Calcular el tag (SHA corto del commit)
        run: echo "TAG=sha-${COMMIT:0:7}" >> "$GITHUB_ENV"
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Login en ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # sin tokens personales

      # Arma el nombre en minúsculas y las etiquetas OCI, entre ellas
      # org.opencontainers.image.source, que enlaza el paquete con tu repo.
      - name: Metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.imagen }}
          tags: type=raw,value=${{ env.TAG }}
          flavor: latest=false                    # nada de latest

      - name: Construir y publicar
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

    # 5. Security: Trivy sobre las imágenes que ya están en ghcr.io
  security:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read           # para bajar las imágenes de ghcr.io
    strategy:
      matrix:
        imagen: [perfil-web, perfil-api]
    steps:
      # Mismo tag que calculó package: "sha-" + 7 primeros caracteres del commit
      - name: Calcular el tag (SHA corto del commit)
        run: echo "TAG=sha-${COMMIT:0:7}" >> "$GITHUB_ENV"
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Login en ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Escanear la imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.imagen }}:${{ env.TAG }}
          severity: CRITICAL        # solo se frena por críticas
          ignore-unfixed: true      # ...y solo las que ya tienen corrección
          exit-code: '1'            # con 0 el job nunca fallaría (descuento en la rúbrica)

  # 6. Smoke: comprobar el contenedor web publicado
  smoke:
    needs: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Calcular el tag (SHA corto del commit)
        run: echo "TAG=sha-${COMMIT:0:7}" >> "$GITHUB_ENV"
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Login en ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar imágenes
        env:
          WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/perfil-web:${{ env.TAG }}
          API_IMAGE: ghcr.io/${{ github.repository_owner }}/perfil-api:${{ env.TAG }}
        run: |
          docker pull "$WEB_IMAGE"
          docker pull "$API_IMAGE"

      - name: Levantar contenedores y comprobar GET /
        env:
          WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/perfil-web:${{ env.TAG }}
          API_IMAGE: ghcr.io/${{ github.repository_owner }}/perfil-api:${{ env.TAG }}
        run: |
          set -eu

          cleanup() {
            docker rm -f perfil-web-smoke api >/dev/null 2>&1 || true
            docker network rm smoke-net >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create smoke-net

          docker run -d \
            --name api \
            --network smoke-net \
            "$API_IMAGE"

          docker run -d \
            --name perfil-web-smoke \
            --network smoke-net \
            -p 127.0.0.1:8080:8080 \
            "$WEB_IMAGE"

          status=""
          for i in $(seq 1 20); do
            status=$(curl -sS \
              -o /tmp/perfil-web.html \
              -w '%{http_code}' \
              http://127.0.0.1:8080/ 2>/dev/null || true)

            if [ "$status" = "200" ]; then
              break
            fi

            sleep 1
          done

          if [ "$status" != "200" ]; then
            echo "ERROR: GET / respondió con HTTP $status"
            echo "--- Logs de Nginx ---"
            docker logs perfil-web-smoke
            echo "--- Logs de la API ---"
            docker logs api
            exit 1
          fi

          echo "OK: GET / respondió HTTP 200"

          if ! grep -Fq 'Julio César' /tmp/perfil-web.html; then
            echo "ERROR: el HTML no contiene el nombre esperado en el título"
            cat /tmp/perfil-web.html
            exit 1
          fi

          echo "OK: el HTML contiene el nombre en el título"
  # 7. Deploy PROD: publicación con aprobación manual
  deploy-prod:
    name: Deploy PROD
    needs: [build, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4